<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      background: radial-gradient(circle at 30% 0%, #1c3a24, #0f1f13);
      color: #eafff0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 18px;
    }
    .logo { text-align: center; animation: sway 2.4s ease-in-out infinite; }
    .logo img { width: 44px; height: 44px; vertical-align: middle; }
    @keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
    h1 {
      text-align: center; font-size: 18px; margin: 4px 0 12px;
      background: linear-gradient(90deg,#76de82,#ffe28a,#76de82);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .next {
      text-align: center; font-size: 13px;
      background: rgba(255,226,138,0.08); border: 1px dashed rgba(255,226,138,0.3);
      padding: 10px; border-radius: 10px; color: #ffe28a; margin-bottom: 12px;
    }
    .update-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      border: 1px solid #76de82; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 12px;
    }
    .update-text { font-size: 12px; color: #eafff0; font-weight: 600; }
    .update-link { font-size: 12px; color: #ffe28a; text-decoration: none; font-weight: 700; }
    .update-link:hover { color: #fff; text-decoration: underline; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 14px; }
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #3a3a3a; border-radius: 24px; transition: .25s; }
    .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .25s; }
    input:checked + .slider { background: #2e7d32; }
    input:checked + .slider::before { transform: translateX(18px); }
    button {
      width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg,#2e7d32,#1b5e20); color: #fff; font-weight: 700; font-size: 14px;
    }
    button:hover { box-shadow: 0 4px 14px rgba(46,125,50,.4); }
    .settings-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; margin-top: 10px; padding: 8px;
      border: 1px solid rgba(118,222,130,0.25); border-radius: 8px;
      background: rgba(255,255,255,0.04); color: #cdeed4;
      font-size: 13px; cursor: pointer; transition: background 0.18s ease;
    }
    .settings-btn:hover { background: rgba(118,222,130,0.15); color: #eafff0; }
    .settings-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="logo"><img src="icons/leaf.svg" alt="Cannabis leaf"></div>
  <h1>4:20 Tracker</h1>
  <div class="update-banner" id="updateBanner" style="display:none">
    <div class="update-text">Update available — v<span id="updateVersion"></span></div>
    <a href="#" id="updateLink" class="update-link">Download</a>
  </div>
  <div class="next" id="next">Checking…</div>
  <div class="row">
    <span>Tracker on</span>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>
  <button id="test">Test Popup</button>
  <button class="settings-btn" id="openSettings" title="Open settings">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
    Settings
  </button>
  <script src="popup.js"></script>
</body>
</html>
